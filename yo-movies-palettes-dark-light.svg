<svg viewBox="0 0 920 480" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="920" height="480" fill="#FFFFFF"/>

  <!-- DARK MODE -->
  <text x="30" y="35" font-family="Arial" font-size="16" fill="#333" font-weight="bold">Dark mode — matches the dark-bg logo</text>
  <g font-family="Arial" font-size="12" fill="#333">
    <rect x="30" y="55" width="120" height="80" rx="6" fill="#151A24"/>
    <text x="30" y="150" font-weight="bold">Background</text>
    <text x="30" y="165" fill="#777">#151A24</text>

    <rect x="180" y="55" width="120" height="80" rx="6" fill="#1F2534"/>
    <text x="180" y="150" font-weight="bold">Surface</text>
    <text x="180" y="165" fill="#777">#1F2534</text>

    <rect x="330" y="55" width="120" height="80" rx="6" fill="#2C3244"/>
    <text x="330" y="150" font-weight="bold">Border</text>
    <text x="330" y="165" fill="#777">#2C3244</text>

    <rect x="480" y="55" width="120" height="80" rx="6" fill="#F2EFE6" stroke="#ddd"/>
    <text x="480" y="150" font-weight="bold">Text</text>
    <text x="480" y="165" fill="#777">#F2EFE6</text>

    <rect x="630" y="55" width="120" height="80" rx="6" fill="#9BA0B5"/>
    <text x="630" y="150" font-weight="bold">Muted text</text>
    <text x="630" y="165" fill="#777">#9BA0B5</text>

    <rect x="780" y="55" width="120" height="80" rx="6" fill="#FF6B4A"/>
    <text x="780" y="150" font-weight="bold">Accent</text>
    <text x="780" y="165" fill="#777">#FF6B4A</text>
  </g>

  <!-- mini preview: dark card -->
  <rect x="30" y="185" width="300" height="70" rx="8" fill="#151A24"/>
  <rect x="45" y="200" width="270" height="40" rx="6" fill="#1F2534" stroke="#2C3244"/>
  <text x="58" y="224" font-family="Arial" font-size="12" fill="#F2EFE6">Find movies</text>
  <rect x="255" y="205" width="50" height="30" rx="5" fill="#FF6B4A"/>

  <line x1="0" y1="290" x2="920" y2="290" stroke="#eee" stroke-width="1"/>

  <!-- LIGHT MODE -->
  <text x="30" y="325" font-family="Arial" font-size="16" fill="#333" font-weight="bold">Light mode — matches the light-bg logo</text>
  <g font-family="Arial" font-size="12" fill="#333">
    <rect x="30" y="345" width="120" height="80" rx="6" fill="#F5F3EE" stroke="#ddd"/>
    <text x="30" y="440" font-weight="bold">Background</text>
    <text x="30" y="455" fill="#777">#F5F3EE</text>

    <rect x="180" y="345" width="120" height="80" rx="6" fill="#FFFFFF" stroke="#ddd"/>
    <text x="180" y="440" font-weight="bold">Surface</text>
    <text x="180" y="455" fill="#777">#FFFFFF</text>

    <rect x="330" y="345" width="120" height="80" rx="6" fill="#DDD8CC"/>
    <text x="330" y="440" font-weight="bold">Border</text>
    <text x="330" y="455" fill="#777">#DDD8CC</text>

    <rect x="480" y="345" width="120" height="80" rx="6" fill="#151A24"/>
    <text x="480" y="440" font-weight="bold">Text</text>
    <text x="480" y="455" fill="#777">#151A24</text>

    <rect x="630" y="345" width="120" height="80" rx="6" fill="#6B6F80"/>
    <text x="630" y="440" font-weight="bold">Muted text</text>
    <text x="630" y="455" fill="#777">#6B6F80</text>

    <rect x="780" y="345" width="120" height="80" rx="6" fill="#FF6B4A"/>
    <text x="780" y="440" font-weight="bold">Accent</text>
    <text x="780" y="455" fill="#777">#FF6B4A</text>
  </g>
</svg>
